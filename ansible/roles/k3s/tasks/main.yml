---
# tasks file for roles/k3s
- name: Set master IP fact
  ansible.builtin.set_fact:
    master_ip: "{{ hostvars[groups['k3s_masters'][0]]['ansible_host'] }}"

- name: Install K3s Server
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik --write-kubeconfig-mode 644" sh -s - server --tls-san {{ master_ip }} --node-taint node-role.kubernetes.io/master=true:NoSchedule
  args:
    creates: /usr/local/bin/k3s
  when: "'k3s_masters' in group_names"
  register: master_install

- name: Wait for K3s API to be ready
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ master_ip }}"
    timeout: 120
  when: 
    - "'k3s_masters' in group_names"
    - master_install.changed

- name: Get K3s node token (from Master)
  ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['k3s_masters'][0] }}"

- name: Set K3s token fact
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_token_raw.stdout | trim }}"

- name: Install K3s Agent (Workers)
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | K3S_URL=https://{{ master_ip }}:6443 K3S_TOKEN={{ k3s_token }} sh -
  args:
    creates: /usr/local/bin/k3s
  when: "'k3s_workers' in group_names"