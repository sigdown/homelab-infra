---
- name: Set Master IP fact
  ansible.builtin.set_fact:
    master_ip: "{{ hostvars[groups['k3s_masters'][0]]['ansible_host'] }}"

- name: Get K3s node token (from Master)
  ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  changed_when: false
  delegate_to: "{{ groups['k3s_masters'][0] }}"

- name: Set K3s token fact
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_token_raw.stdout | trim }}"

- name: Install K3s Agent (Workers)
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | K3S_URL=https://{{ master_ip }}:6443 K3S_TOKEN={{ k3s_token }} sh -
  args:
    creates: /usr/local/bin/k3s