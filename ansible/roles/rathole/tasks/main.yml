---
# tasks file for roles/rathole
- name: Determine rathole role (server or client)
  ansible.builtin.set_fact:
    rathole_type: "{{ 'server' if ('edge' in group_names) else 'client' }}"

- name: Create rathole directory
  ansible.builtin.file:
    path: /opt/rathole
    state: directory

- name: Copy rathole client config
  ansible.builtin.template:
    src: "rathole_{{ rathole_type }}/{{ rathole_type }}.toml.j2"
    dest: "/opt/rathole/{{ rathole_type }}.toml"
  notify: Restart rathole container

- name: Copy docker-compose template
  ansible.builtin.template:
    src: "rathole_{{ rathole_type }}/docker-compose.yml.j2"
    dest: /opt/rathole/docker-compose.yml
  notify: "Restart rathole container"

- name: Run rathole client docker-compose
  community.docker.docker_compose_v2:
    project_src: /opt/rathole
    state: present